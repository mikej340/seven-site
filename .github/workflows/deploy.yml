name: Deploy Seven

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional mikej340/seven commit SHA (defaults to main)
        required: false
        type: string
  repository_dispatch:
    types:
      - source-deployed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application source
        uses: actions/checkout@v6
        with:
          repository: mikej340/seven
          ref: ${{ github.event.client_payload.source_sha || inputs.source_sha || 'main' }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      - name: Test and build the root-domain site
        run: npm run test:root
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
